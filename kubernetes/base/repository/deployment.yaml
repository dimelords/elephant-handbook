apiVersion: v1
kind: ConfigMap
metadata:
  name: elephant-repository-config
data:
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "elephant-archive"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elephant-repository
  labels:
    app: elephant-repository
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elephant-repository
  template:
    metadata:
      labels:
        app: elephant-repository
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "1080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: wait-for-minio
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z minio 9000; do
                echo "Waiting for MinIO..."
                sleep 2
              done
      containers:
        - name: repository
          image: ghcr.io/dimelords/elephant-repository:latest
          ports:
            - containerPort: 1080
              name: http
          env:
            - name: CONN_STRING
              value: "postgres://postgres:postgres@postgres:5432/elephant?sslmode=disable"
            - name: MIGRATE_DB
              value: "true"
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: elephant-repository-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: elephant-repository-config
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              value: "minioadmin"
            - name: S3_ACCESS_KEY_SECRET
              value: "minioadmin"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: elephant-repository-config
                  key: LOG_LEVEL
            - name: OIDC_CONFIG
              value: "http://keycloak:8180/realms/elephant/.well-known/openid-configuration"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1080
            initialDelaySeconds: 10
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - elephant-repository
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: repository
  labels:
    app: elephant-repository
spec:
  type: ClusterIP
  ports:
    - port: 1080
      targetPort: 1080
      protocol: TCP
      name: http
  selector:
    app: elephant-repository
